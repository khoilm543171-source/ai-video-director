name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestrator dependencies
        run: python -m pip install -r requirements-orchestrator.txt

      - name: Compile Python
        run: python -m compileall core agents renderers services audio scripts api.py

      - name: Run tests
        run: pytest -q